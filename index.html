<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>奇幻中世纪 - 精简 RTS 原型</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { margin:0; background:#080808; color:#eee; font-family: Arial, "Microsoft YaHei", sans-serif; display:flex; flex-direction:column; height:100vh; }
    #topbar { padding:8px 12px; background:#111; display:flex; align-items:center; gap:12px; }
    #game-container { flex:1; display:flex; align-items:center; justify-content:center; }
    #info { margin-left:12px; font-family:monospace; }
    button { padding:6px 10px; background:#2b2b2b; color:#fff; border:1px solid #444; cursor:pointer; }
    button:hover { filter:brightness(1.1); }
    .faction-btn { padding:6px 10px; border-radius:4px; border:2px solid #333; cursor:pointer; }
    #footer { padding:8px 12px; background:#0d0d0d; color:#9a9a9a; font-size:12px; }
  </style>
</head>
<body>
  <div id="topbar">
    <div>
      <strong>奇幻中世纪 - RTS 原型</strong>
    </div>
    <div id="info"></div>
    <div style="margin-left:auto">
      <button id="restart">重来</button>
    </div>
  </div>

  <div id="game-container">
    <div id="phaser-game"></div>
  </div>

  <div id="footer">
    操作：左键单击/拖框选择单位；右键（桌面）下达移动/攻击命令。适合在桌面浏览器试玩。
  </div>

  <!-- Phaser 3 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
